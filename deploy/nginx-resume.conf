# Reverse proxy for resume.udsy.in
#
# Two settings here are load-bearing and easy to get wrong. The app streams progress
# over Server-Sent Events for the whole length of a run, so buffering must be off or
# the UI sits blank and then dumps everything at the end. And a complete run takes
# ~15 minutes, so the read timeout has to outlast it or nginx kills the stream
# mid-generation and the user loses the work.

server {
    listen 80;
    listen [::]:80;
    server_name resume.udsy.in;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name resume.udsy.in;

    ssl_certificate     /etc/letsencrypt/live/resume.udsy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume.udsy.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A dump can be a 4 MB PDF.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE: hand every chunk straight through.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # Outlast a full ~15 minute run.
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 30s;
    }
}
