name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The offline suite compiles every template, so a real TeX toolchain is
      # required. texlive-fonts-extra is not optional: the templates use
      # CormorantGaramond, FiraSans, roboto, sourcesanspro and noto-sans, none of
      # which ship in a base install — CI caught this by failing to compile.
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No API key is configured, and none is needed: these checks make no
      # model calls. That is the point of keeping them separate.
      - name: Offline checks
        run: python3 tests/check_offline.py

      - name: Web layer checks
        run: python3 tests/check_web.py
